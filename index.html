*{margin:0;padding:0;box-sizing:border-box}

:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.container{max-width:960px;margin:0 auto}
.theme-toggle{position:fixed;top:1rem;right:1rem;z-index:100;width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);background:var(--panel);color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem}

.hero-quote small{display:block;margin-top:.8rem;font-family:var(--font-body);font-size:.78rem;color:var(--faint)}
.search-box{position:relative;margin-bottom:2.5rem}

.battle-item .go{color:var(--faint);transition:transform var(--ease),color var(--ease)}

mark.hl{background:var(--hl);color:var(--hl-t);padding:0 .12em;border-radius:3px}
.battle-page{padding-top:4.5rem}

.battle-page .page-title{margin-bottom:2.5rem}

.battle-page .page-title .date{font-family:var(--font-head);font-weight:300;font-size:1.3rem;color:var(--text)}
.battle-page .page-title .medinsky-line{display:block;margin-top:.4rem;font-size:.75rem;color:var(--faint)}
.section{position:relative;margin-bottom:1.5rem;padding:2rem 2.2rem;background:var(--panel);border:1px solid var(--border);border-radius:28px}
.section-label{display:flex;align-items:center;gap:.7rem;font-family:var(--font-head);font-weight:400;font-size:1.5rem;color:var(--gold);margin-bottom:1rem;line-height:1.1}
.section-label::before{content:"✦";font-size:.8rem}
.section-text{font-size:.95rem;line-height:1.8;max-width:68ch}
.section-text + .section-text{margin-top:.9rem}
.names{font-style:italic;color:var(--muted)}
.section.outcome,.section.deep{background:var(--paper);border-color:var(--paper);color:var(--paper-text)}
.section.outcome .section-label,.section.deep .section-label{color:var(--paper-text)}
.section.tasks{background:var(--panel-2)}
.section.tasks .section-label{color:var(--red)}
.section.map-section{padding:1.2rem}
.section.map-section .section-label{padding:.4rem 1rem 0}
.map-frame{border-radius:18px;overflow:hidden;background:#000;line-height:0}
.map-frame img{width:100%;height:auto;display:block}
.map-caption{font-size:.76rem;color:var(--faint);padding:.7rem 1rem 0;line-height:1.5}
.deep-hint{font-size:.82rem;color:var(--paper-muted);margin:-.3rem 0 1rem}
.deep-item{border-top:1px solid rgba(42,29,17,.28)}
.deep-q{width:100%;display:flex;align-items:center;gap:.9rem;padding:1rem .2rem;background:none;border:0;color:inherit;font:inherit;font-weight:600;font-size:.98rem;text-align:left;cursor:pointer}
.deep-q .plus{flex-shrink:0;width:26px;height:26px;border:1px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:400;transition:transform .25s ease}
.deep-q[aria-expanded="true"] .plus{transform:rotate(45deg)}
.deep-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.deep-a.open{grid-template-rows:1fr}
.deep-a>div{overflow:hidden}
.deep-a p{padding:0 .2rem 1.2rem 2.6rem;font-size:.93rem;line-height:1.8;max-width:64ch}
.task{padding:1.1rem 0;border-top:1px solid var(--border)}
.task-num{font-family:var(--font-head);font-size:1.1rem;color:var(--red);margin-right:.6rem}
.task-q{line-height:1.65;margin-bottom:.8rem;font-size:.92rem}
.answer-row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.answer-input{flex:1;min-width:170px;padding:.5rem .2rem;border:0;border-bottom:1px solid var(--faint);background:transparent;color:var(--text);font:inherit;font-size:.88rem}
.answer-input::placeholder{color:var(--faint)}
.answer-input:focus{outline:none;border-color:var(--gold)}
.answer-input.correct{border-color:var(--ok)}
.answer-input.wrong{border-color:var(--red)}
.check-btn{padding:.6rem 1.6rem;border:0;border-radius:999px;background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#fff;font:inherit;font-size:.78rem;font-weight:600;cursor:pointer}
.check-btn:hover{filter:brightness(1.12)}
.check-btn:active{transform:translateY(1px)}
.result{display:none;margin-top:.7rem;padding:.55rem .9rem;border-radius:14px;font-size:.84rem}
.result.show{display:block}
.result.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.result.fail{background:var(--bad-bg);border:1px solid var(--red)}
.result .tag{font-weight:700;margin-right:.4rem}
.result.ok .tag{color:var(--ok)}
.result.fail .tag{color:var(--red)}
footer{margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--border);text-align:center;font-size:.72rem;letter-spacing:.2em;color:var(--faint)}
.view{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.view{animation:none}html{scroll-behavior:auto}.deep-a,.deep-q .plus{transition:none}}
.no-results{display:none;text-align:center;padding:2.5rem 1rem;color:var(--faint);font-size:.85rem}
.no-results.show{display:block}
.no-results .big{display:block;font-family:var(--font-head);font-size:1.8rem;color:var(--muted)}
@media (max-width:640px){
 header.page-header{padding:4.5rem 0 2rem}
 .section{padding:1.5rem 1.2rem;border-radius:22px}
 .battle-item{gap:.8rem}
 .battle-item .num{min-width:2.2rem;font-size:1.3rem}
 .year-title .year-meta{display:none}
 .deep-a p{padding-left:.2rem}
}

.sp.s1{--s:22px;top:7%;left:6%}.sp.s2{--s:12px;top:14%;right:9%;animation-delay:1.5s}.sp.s3{--s:16px;top:46%;left:3%;animation-delay:3s}.sp.s4{--s:26px;bottom:9%;right:7%;animation-delay:.8s}.sp.s5{--s:12px;bottom:15%;left:12%;animation-delay:2.2s}

<script>
(function(){
'use strict';

const BATTLES = [
{id:'brest',year:1941,index:'01',title:'Оборона Бреста',date:'22 июня — июль 1941',para:'§29 · С. 308–321',img:'images/A.png',imgCaption:'Схема обороны Брестской крепости, 1941 г.',commandersLabel:'Участники',commanders:'П.М. Гаврилов, И.Н. Зубачев, Е.М. Фомин, А.М. Кижеватов',course:['Брестская крепость первой приняла удар немецких войск 22 июня 1941 года. Гарнизон, насчитывавший около 3,5 тысяч человек, оказался в полном окружении уже в первые часы войны.','Однако бойцы под командованием майора П.М. Гаврилова, капитана И.Н. Зубачева, полкового комиссара Е.М. Фомина и лейтенанта А.М. Кижеватова организовали упорную оборону. Штурмовые группы вермахта несли большие потери.','Отдельные группы защитников сражались в подвалах и казематах более месяца — до конца июля. На стенах крепости остались надписи: «Умираем, но не сдаёмся!», «Прощай, Родина!».','Оборона Брестской крепости стала символом стойкости и массового героизма советских солдат в первые, самые тяжёлые дни войны.'],outcome:'Сдача крепости. В 1965 году Брестской крепости присвоено звание «Крепость-герой».',tasks:[
{q:'В обороне Брестской крепости важную роль сыграл ____________. (Введите фамилию)',answer:'гаврилов|п.м. гаврилов'},
{q:'Заполните пропуск: «Оборона Брестской крепости началась в ______ 1941 года».',answer:'июне|июнь'},
{q:'В каком году Брестской крепости было присвоено звание «Крепость-герой»?',answer:'1965'},
{q:'Укажите название реки, на которой расположена Брестская крепость.',answer:'западный буг|буг'},
{q:'Установите соответствие: А) Начало обороны — Б) Освобождение Бреста — В) Звание «Крепость-герой». Годы: 1) 1941 2) 1944 3) 1965. Ответьте цифрами через запятую.',answer:'1, 2, 3'},
{q:'Прочтите отрывок: «В 6 часов 23 июня войска 4-й армии нанесли противнику контрудар из района Жабинки...» О каком событии идёт речь?',answer:'оборона бреста|брестская крепость'},
{q:'Сколько дней продолжалась организованная оборона Брестской крепости?',answer:'более месяца|месяц'},
{q:'В каком году Брест был освобождён советскими войсками?',answer:'1944'},
{q:'На территории какой республики находится Брестская крепость?',answer:'белоруссия|беларусь|бсср'},
{q:'Укажите фамилию полкового комиссара — одного из руководителей обороны.',answer:'фомин|е.м. фомин'}
]},
{id:'smolensk',year:1941,index:'02',title:'Смоленское сражение',date:'10 июля — 10 сентября 1941',para:'§29 · С. 308–321',img:'images/B.jpg',imgCaption:'Карта боевых действий на Смоленском направлении, 1941 г.',commandersLabel:'Командующие',commanders:'С.К. Тимошенко (Западный фронт), В.Я. Качалов, В.А. Хоменко, С.А. Калинин, И.И. Масленников, К.К. Рокоссовский, А.И. Еременко (Брянский фронт)',course:['Смоленское сражение стало одним из крупнейших оборонительных и наступательных сражений первого периода войны. Немецкая группа армий «Центр» стремилась кратчайшим путём прорваться к Москве через Смоленск.','Советские войска Западного, Резервного и Брянского фронтов вели тяжёлые оборонительные бои, постоянно контратакуя. В районе Смоленска развернулось крупное танковое сражение.','Особую роль сыграли соединения под командованием К.К. Рокоссовского и А.И. Еременко. В ходе сражения советское командование впервые провело крупную наступательную операцию — Рославльско-Новозыбковскую.','Главный итог сражения: впервые за всю кампанию немецкие войска были вынуждены перейти к обороне на главном направлении.'],outcome:'Предпринята первая попытка контрнаступления, немецкие войска впервые перешли к обороне.',tasks:[
{q:'Укажите фамилию командующего Западным фронтом в Смоленском сражении.',answer:'тимошенко'},
{q:'Назовите немецкую группу армий, наступавшую на Смоленск.',answer:'центр'},
{q:'В каком году Смоленск был освобождён советскими войсками?',answer:'1943'},
{q:'Назовите фамилию командующего 16-й армией, особо отличившегося в Смоленском сражении.',answer:'рокоссовский'},
{q:'Расположите события в хронологической последовательности: 1) Смоленское сражение 2) Начало блокады Ленинграда 3) Московская битва. Ответьте цифрами через запятую.',answer:'1, 2, 3'},
{q:'Какое крупное сражение развернулось в районе Смоленска?',answer:'танковое'},
{q:'В каком месяце 1941 года началось Смоленское сражение?',answer:'июль'},
{q:'В каком месяце 1941 года завершилось Смоленское сражение?',answer:'сентябрь'},
{q:'Укажите фамилию командующего Брянским фронтом в Смоленском сражении.',answer:'еременко'},
{q:'Сколько месяцев длилось Смоленское сражение?',answer:'2|два'}
]},
{id:'moscow',year:1941,index:'03',title:'Московская битва (операция «Тайфун»)',date:'30 сентября 1941 — 20 апреля 1942',para:'§30 · С. 322–337',img:'images/C.webp',imgCaption:'Великая битва под Москвой. Карта обороны и разгрома немецких войск.',commandersLabel:'Командующие',commanders:'Г.К. Жуков (Западный фронт), И.С. Конев (Калининский фронт), С.К. Тимошенко (Юго-Западный фронт), К.К. Рокоссовский (16-я армия), И.В. Панфилов (316-я стрелковая дивизия), В.В. Клочков (политрук 4-й роты), И.В. Болдин',course:['Немецкое командование начало операцию «Тайфун» — генеральное наступление на Москву. План предусматривал окружение и уничтожение основных сил Западного, Резервного и Брянского фронтов.','В октябре 1941 года враг прорвал оборону и окружил крупные силы советских войск под Вязьмой и Брянском. Критический момент наступил в конце октября – ноябре, когда бои шли в 80–100 км от столицы.','7 ноября 1941 года на Красной площади состоялся знаменитый военный парад — прямо с парада войска уходили на фронт. Это событие укрепило дух армии и народа.','Дивизия генерала И.В. Панфилова насмерть стояла на Волоколамском направлении. У разъезда Дубосеково 28 панфиловцев во главе с политруком В.В. Клочковым приняли неравный бой с танками.','5–6 декабря 1941 года Красная Армия перешла в контрнаступление, отбросив врага на 150–400 км. Это было первое крупное поражение вермахта.'],outcome:'Крах стратегии блицкрига, укрепление международного авторитета СССР и ускорение создания антигитлеровской коалиции.',tasks:[
{q:'Назовите кодовое название немецкой операции по захвату Москвы.',answer:'тайфун'},
{q:'Заполните пропуск: «Немецкая операция по захвату Москвы в 1941 г. называлась ______».',answer:'тайфун'},
{q:'Укажите фамилию командующего Западным фронтом в Московской битве.',answer:'жуков'},
{q:'Назовите фамилию политрука 4-й роты, произнёсшего слова «Велика Россия, а отступать некуда».',answer:'клочков'},
{q:'Прочтите отрывок: «Впервые за прошедшие полгода перечислял города, которые мы не оставили, а взяли обратно...» О какой битве идёт речь?',answer:'московская|битва за москву'},
{q:'Когда началось контрнаступление советских войск под Москвой?',answer:'5 декабря|декабрь 1941'},
{q:'Назовите фамилию командира 316-й стрелковой дивизии.',answer:'панфилов'},
{q:'В каком месяце 1941 года началась Московская битва?',answer:'сентябрь'},
{q:'Назовите фамилию командующего Калининским фронтом.',answer:'конев'},
{q:'В каком месяце 1942 года завершилась Московская битва?',answer:'апрель'}
]},
{id:'leningrad',year:1941,index:'04',title:'Блокада Ленинграда',date:'8 сентября 1941 — 27 января 1944',para:'§30 · С. 322–337',img:'images/D.jpg',imgCaption:'Карта блокады Ленинграда 1941–1944 гг.',commandersLabel:'Командующие',commanders:'Г.К. Жуков, Л.А. Говоров (Ленинградский фронт), К.А. Мерецков (Волховский фронт)',course:['8 сентября 1941 года немецкие войска замкнули кольцо вокруг Ленинграда, захватив Шлиссельбург. Началась 872-дневная блокада.','Единственной связью с большой землёй стала «Дорога жизни» через Ладожское озеро: летом — по воде, зимой — по льду.','Город подвергался постоянным артиллерийским обстрелам и авиабомбардировкам. Свирепствовал голод: рабочие получали по 250 г хлеба в день, дети — по 125 г.','Неоднократные попытки прорыва блокады увенчались успехом лишь в январе 1943 года (операция «Искра»). Полное освобождение произошло 27 января 1944 года.','За годы блокады от голода, холода и обстрелов погибли, по разным оценкам, от 600 тысяч до 1,5 миллиона человек.'],outcome:'Полное снятие блокады 27 января 1944 года. В 1945 году Ленинграду присвоено звание «Город-герой».',tasks:[
{q:'Заполните пропуск: «Дорога жизни связывала с остальной территорией страны осаждённый город ______».',answer:'ленинград'},
{q:'Заполните пропуск: «Блокада Ленинграда началась в ______ 1941 г.».',answer:'сентябре|сентябрь'},

{id:'tikhvin',year:1941,index:'05',title:'Тихвинская операция',date:'10 ноября — 30 декабря 1941',para:'§30 · С. 322–337',img:'images/E.webp',imgCaption:'Тихвинская наступательная операция, 10 ноября – 30 декабря 1941 г.',commandersLabel:'Командующие',commanders:'К.А. Мерецков (4-я армия), Н.К. Клыков (52-я армия)',course:['Немецкое командование стремилось соединиться с финскими войсками восточнее Ленинграда, полностью замкнуть блокаду и создать второе кольцо окружения.','В ноябре 1941 года советские войска нанесли контрудар под Тихвином. В ходе упорных боёв 9 декабря город был освобождён, а немецкие части отброшены за реку Волхов.','Операция не позволила создать второе кольцо блокады вокруг Ленинграда и обеспечила работу «Дороги жизни» через Ладожское озеро.'],outcome:'Предотвращение соединения немецких и финских войск. Ликвидация угрозы полной изоляции Ленинграда.',tasks:[
{q:'С войсками какой страны стремились соединиться немецкие войска под Тихвином?',answer:'финскими|финляндией'},
{q:'За какую реку были отброшены немецкие части в ходе операции?',answer:'волхов'},
{q:'В каком году была проведена Тихвинская операция?',answer:'1941'},
{q:'Назовите город, освобождённый в ходе операции.',answer:'тихвин'},
{q:'Что не позволила создать Тихвинская операция вокруг Ленинграда?',answer:'второе кольцо|второе кольцо блокады'},
{q:'В каком месяце 1941 года началась Тихвинская операция?',answer:'ноябрь'},
{q:'В каком месяце 1941 года завершилась Тихвинская операция?',answer:'декабрь'},
{q:'Блокаду какого города должна была замкнуть немецкая операция?',answer:'ленинград'},
{q:'Укажите фамилию командующего 4-й армией.',answer:'мерецков'},
{q:'Сколько месяцев длилась Тихвинская операция?',answer:'2|два'}
]},
{id:'sevastopol',year:1941,index:'06',title:'Оборона Севастополя',date:'30 октября 1941 — 4 июля 1942',para:'§31 · С. 338–353',img:'images/F.webp',imgCaption:'Схема обороны Севастополя, 5 ноября 1941 – 4 июля 1942 г.',commandersLabel:'Командующие',commanders:'И.Е. Петров (Приморская армия), Ф.С. Октябрьский (Черноморский флот)',course:['Севастополь — главная база Черноморского флота — стал одним из главных объектов немецкого наступления на южном направлении.','С 30 октября 1941 года началась героическая оборона Севастополя. Город защищали части Приморской армии под командованием генерала И.Е. Петрова и корабли Черноморского флота.','Немецкие войска предприняли три крупных штурма. Защитники при поддержке кораблей флота держались 250 дней.','После третьего штурма, начавшегося 7 июня 1942 года, немецкие войска прорвали оборону. 4 июля 1942 года город был оставлен.'],outcome:'Потеря Севастополя. 9 мая 1944 года Севастополь был освобождён.',tasks:[
{q:'Сколько дней длилась оборона Севастополя? (Введите число)',answer:'250'},
{q:'Назовите фамилию командующего Приморской армией.',answer:'петров'},
{q:'Назовите фамилию командующего Черноморским флотом.',answer:'октябрьский'},
{q:'В каком месяце 1942 года Севастополь был оставлен советскими войсками?',answer:'июль'},
{q:'Назовите дату освобождения Севастополя.',answer:'9 мая 1944|9 мая'},
{q:'В каком месяце 1941 года началась оборона Севастополя?',answer:'октябрь'},
{q:'Назовите флот, участвовавший в обороне Севастополя.',answer:'черноморский'},
{q:'В каком году Севастополь был освобождён?',answer:'1944'},
{q:'Сколько крупных штурмов предприняли немецкие войска?',answer:'3|три'},
{q:'Какой город был главной базой Черноморского флота?',answer:'севастополь'}
]},
{id:'kharkov',year:1942,index:'07',title:'Харьковская наступательная операция',date:'12–29 мая 1942',para:'§32 · С. 354–373',img:'images/G.webp',imgCaption:'Харьковская наступательная операция, май 1942 г.',commandersLabel:'Командующие',commanders:'С.К. Тимошенко (Юго-Западный фронт), Р.Я. Малиновский (Южный фронт)',course:['Советское командование планировало крупное наступление на Харьков, чтобы освободить город и создать условия для дальнейшего продвижения на запад.','Однако немецкие войска упредили удар, нанеся контрудар из района Краматорска. Значительные силы Юго-Западного фронта попали в окружение в районе Барвенковского выступа.','В результате операции советские войска потерпели тяжёлое поражение, потеряв две армии — более 200 тысяч человек пленными и убитыми.','Поражение под Харьковом открыло немцам путь к Сталинграду и Кавказу.'],outcome:'Поражение. Уничтожены войска двух армий, стратегическая инициатива перешла к немецкому командованию.',tasks:[
{q:'В каком месяце 1942 года произошла Харьковская операция?',answer:'май'},
{q:'Назовите фамилию командующего Юго-Западным фронтом.',answer:'тимошенко'},
{q:'Назовите фамилию командующего Южным фронтом.',answer:'малиновский'},
{q:'Сколько армий потеряли советские войска под Харьковом? (Введите число)',answer:'2|две'},
{q:'К какому городу открылся путь после поражения под Харьковом?',answer:'сталинград'},
{q:'К какому региону открылся путь после поражения?',answer:'кавказ'},
{q:'К кому перешла стратегическая инициатива?',answer:'немцам|вермахту'},
{q:'В каком году произошла Харьковская операция?',answer:'1942'},
{q:'Сколько человек потеряли советские войска под Харьковом?',answer:'200 тысяч|200000'},
{q:'Как назывался выступ, в котором оказались окружены советские войска?',answer:'барвенковский'}
]},
{id:'rzhev',year:1942,index:'08',title:'Ржевско-Вяземская операция («Ржевская мясорубка»)',date:'8 января — 20 апреля 1942',para:'§30 · С. 322–337',img:'images/H.png',imgCaption:'Ржевско-Вяземская операция, 1942 г.',commandersLabel:'Командующие',commanders:'В.Д. Соколовский, М.А. Пуркаев, И.С. Конев (Калининский фронт)',course:['В ходе зимнего контрнаступления 1941–1942 годов советские войска стремились разгромить группу армий «Центр» и освободить Ржев и Вязьму.','Бои приняли затяжной и крайне кровопролитный характер. Ржевско-Вяземский выступ стал ареной ожесточённых сражений.','Несмотря на огромные потери, полностью выполнить задачу не удалось — противник сохранил за собой Ржев и Вязьму до весны 1943 года.'],outcome:'Освобождение городов Ржев и Вязьма (март 1943 года). Огромные потери с обеих сторон.',tasks:[
{q:'Какое неофициальное название получила Ржевско-Вяземская операция?',answer:'ржевская мясорубка'},
{q:'Назовите фамилию одного из командующих операцией.',answer:'соколовский'},
{q:'Назовите один из городов, освобождённых в ходе операции.',answer:'ржев'},
{q:'Назовите второй город, освобождённый в ходе операции.',answer:'вязьма'},
{q:'В каком году произошла Ржевско-Вяземская операция?',answer:'1942'},
{q:'В каком месяце 1942 года произошла операция?',answer:'март'},
{q:'Назовите группу армий, которой противостояли советские войска.',answer:'центр'},
{q:'Назовите фамилию второго командующего операцией.',answer:'пуркаев'},
{q:'В каком году были освобождены Ржев и Вязьма?',answer:'1943'},
{q:'Сколько месяцев продолжалась Ржевская битва?',answer:'более года|год'}
]},
{id:'stalingrad',year:1942,index:'09',title:'Сталинградская битва (операции «Уран» и «Кольцо»)',date:'17 июля 1942 — 2 февраля 1943',para:'§33 · С. 374–389',img:'images/I.jpeg',imgCaption:'Сталинградская битва. Карта боевых действий 1942–1943 гг.',commandersLabel:'Командующие и участники',commanders:'К.К. Рокоссовский (Донской фронт), Н.Ф. Ватутин (Юго-Западный фронт), А.И. Ерёменко (Сталинградский фронт), В.И. Чуйков (62-я армия), М.С. Шумилов (64-я армия), Я.Ф. Павлов (сержант), Р.Я. Малиновский',course:['Летом 1942 года немецкие войска вышли к Сталинграду, стремясь захватить город, перерезать Волгу и лишить СССР важнейшей транспортной артерии.','В городе развернулись упорные уличные бои. Особенно прославился «дом Павлова» — четырёхэтажный жилой дом, который группа сержанта Я.Ф. Павлова обороняла 58 дней.','19 ноября 1942 года Красная Армия перешла в контрнаступление (операция «Уран»). 23 ноября в районе Калача замкнулось кольцо окружения.','В январе–феврале 1943 года в ходе операции «Кольцо» окружённые войска были разгромлены. 2 февраля 1943 года фельдмаршал Паулюс был взят в плен.','Победа под Сталинградом стала началом коренного перелома в Великой Отечественной войне.'],outcome:'Начало коренного перелома в войне. Складывание антигитлеровской коалиции.',tasks:[
{q:'Назовите кодовое название операции по окружению немцев под Сталинградом.',answer:'уран'},
{q:'Назовите кодовое название операции по ликвидации окружённой группировки.',answer:'кольцо'},
{q:'Назовите фамилию фельдмаршала, взятого в плен под Сталинградом.',answer:'паулюс'},
{q:'В ходе Сталинградской битвы Донским фронтом командовал генерал ______.',answer:'рокоссовский'},
{q:'Прочтите отрывок: «Трёхмесячная борьба за овладение городом...» О каком городе идёт речь?',answer:'сталинград'},
{q:'Назовите фамилию командующего 62-й армией.',answer:'чуйков'},
{q:'Назовите реку, к которой вышли немецкие войска под Сталинградом.',answer:'волга'},
{q:'В каком году завершилась Сталинградская битва?',answer:'1943'},
{q:'Назовите дату начала контрнаступления под Сталинградом.',answer:'19 ноября 1942|19 ноября'},
{q:'Сколько дней обороняла группа Павлова «дом Павлова»?',answer:'58'}
]},
{id:'kavkaz',year:1943,index:'10',title:'Битва за Кавказ',date:'25 июля 1942 — 9 октября 1943',para:'§33 · С. 374–389',img:'images/J.webp',imgCaption:'Битва за Кавказ, 1942–1943 гг.',commandersLabel:'Командующие',commanders:'С.М. Будённый (Северо-Кавказский фронт), И.В. Тюленев (Закавказский фронт), И.Е. Петров, Р.Я. Малиновский',course:['Летом 1942 года немецкие войска начали наступление на Кавказ, стремясь захватить нефтяные промыслы Грозного и Баку.','Советские войска вели тяжёлые оборонительные бои, остановив врага у Орджоникидзе и на перевалах Главного Кавказского хребта.','В январе 1943 года началось контрнаступление, в результате которого были освобождены значительные территории Кавказа и Ростовская область.','Битва за Кавказ завершилась 9 октября 1943 года полным освобождением региона.'],outcome:'Освобождение Кавказа и Ростовской области. Ликвидация угрозы потери нефтяных районов.',tasks:[
{q:'Что было главной целью немецкого наступления на Кавказ?',answer:'нефть|нефтяные'},
{q:'У какого города был остановлен враг на Кавказе?',answer:'орджоникидзе|владикавказ'},
{q:'Назовите хребет, на перевалах которого шли бои.',answer:'главный кавказский'},
{q:'В каком году началась битва за Кавказ?',answer:'1942'},
{q:'В каком году завершилась битва за Кавказ?',answer:'1943'},
{q:'Назовите область, освобождённую в ходе контрнаступления.',answer:'ростовская'},
{q:'Назовите город (нефтяной центр), который стремились захватить немцы.',answer:'баку|грозный'},
{q:'В каком месяце 1943 года началось контрнаступление на Кавказе?',answer:'январь'},
{q:'У какого города был остановлен враг на Кавказе?',answer:'орджоникидзе'},
{q:'Какой хребет упоминается в связи с битвой за Кавказ?',answer:'главный кавказский'}
]},
{id:'iskra',year:1943,index:'11',title:'Операция «Искра»',date:'12–30 января 1943',para:'§33 · С. 374–389',img:'images/K.webp',imgCaption:'Операция «Искра». Прорыв блокады Ленинграда, январь 1943 г.',commandersLabel:'Командующие',commanders:'Л.А. Говоров (Ленинградский фронт), К.А. Мерецков (Волховский фронт)',course:['Целью операции было прорвать блокаду Ленинграда и восстановить сухопутную связь города со страной.','Несмотря на тяжёлые бои и большие потери, 18 января 1943 года кольцо блокады было прорвано. Был создан коридор шириной 8–11 км.','По узкой полосе земли за 17 дней была проложена железная дорога, по которой в Ленинград пошли поезда с продовольствием и боеприпасами.','Полное освобождение Ленинграда произошло через год — 27 января 1944 года.'],outcome:'Прорыв блокады Ленинграда 18 января 1943 года. Создание коридора шириной 8–11 км.',tasks:[
{q:'Назовите кодовое название операции по прорыву блокады Ленинграда.',answer:'искра'},
{q:'Назовите дату прорыва блокады Ленинграда.',answer:'18 января 1943|18 января'},
{q:'Назовите фамилию командующего Ленинградским фронтом.',answer:'говоров'},
{q:'Назовите фамилию командующего Волховским фронтом.',answer:'мерецков'},
{q:'Какова была ширина созданного коридора (в км)?',answer:'8-11|8-11 км'},
{q:'Южнее какого озера наносились удары?',answer:'ладожское'},
{q:'В каком году была проведена операция «Искра»?',answer:'1943'},
{q:'В каком месяце 1943 года была проведена операция?',answer:'январь'},
{q:'Сколько дней потребовалось на прокладку железной дороги?',answer:'17'},
{q:'Когда произошло полное освобождение Ленинграда?',answer:'27 января 1944|27 января'}
]},
{id:'kursk',year:1943,index:'12',title:'Курская битва («Цитадель»). Сражение под Прохоровкой',date:'5 июля — 23 августа 1943',para:'§34 · С. 390–405',img:'images/L.webp',imgCaption:'Курская битва. Карта боевых действий, июль–август 1943 г.',commandersLabel:'Командующие и участники',commanders:'К.К. Рокоссовский (Центральный фронт), Н.Ф. Ватутин (Воронежский фронт), П.А. Ротмистров, И.С. Конев (Степной фронт), И.Н. Кожедуб',course:['Немецкое командование планировало операцию «Цитадель» — наступление на Курском выступе с целью окружить и уничтожить крупные силы советских войск.','Советская разведка своевременно вскрыла планы врага. Оборона была подготовлена заранее: создана глубоко эшелонированная система укреплений.','5 июля 1943 года немцы перешли в наступление, но завязли в обороне. 12 июля под Прохоровкой произошло крупнейшее танковое сражение в истории.','В тот же день началось контрнаступление советских войск. Орёл был освобождён 5 августа, Белгород — в тот же день, Харьков — 23 августа.','Курская битва завершила коренной перелом в Великой Отечественной войне.'],outcome:'Освобождение Орла, Харькова и Белгорода. Первый артиллерийский салют с начала войны.',tasks:[
{q:'Назовите кодовое название немецкой операции на Курской дуге.',answer:'цитадель'},
{q:'Под каким населённым пунктом произошло крупнейшее танковое сражение?',answer:'прохоровка'},
{q:'Назовите дату сражения под Прохоровкой.',answer:'12 июля 1943|12 июля'},
{q:'Назовите кодовое название операции по освобождению Орла.',answer:'кутузов'},
{q:'Прочтите отрывок: «Противник в кровавом поту, с диким упорством решил пробиться к городу сквозь Прохоровскую щель...» О какой битве идёт речь?',answer:'курская|курская битва'},
{q:'Назовите фамилию командующего Центральным фронтом.',answer:'рокоссовский'},
{q:'Назовите фамилию командующего Воронежским фронтом.',answer:'ватутин'},
{q:'В каком году произошла Курская битва?',answer:'1943'},

{h:'Музыка в осаждённом городе',t:'9 августа 1942 года в блокадном Ленинграде впервые исполнили Седьмую симфонию Шостаковича. Оркестр собирали буквально по частям: многие музыканты были истощены.'},
{h:'Метроном вместо тишины',t:'По радио стучал метроном: быстрый ритм означал воздушную тревогу, медленный — отбой. Его называли «пульсом города».'},
{h:'Дневник Тани Савичевой',t:'Дневник состоит из девяти страниц. На шести записаны даты смерти родных, затем идут слова «Савичевы умерли», «Умерли все» и «Осталась одна Таня». Сама Таня умерла в 1944 году.',img:'images/c2.jpg',cap:'Дневник Тани Савичевой'},
{h:'Эрмитаж в блокаду',t:'Из Эрмитажа эвакуировали более миллиона экспонатов, а подвалы музея стали бомбоубежищем для сотрудников и жителей.'},
{h:'125 граммов хлеба',t:'С 20 ноября по 25 декабря 1941 года рабочие получали 250 граммов хлеба в день, а дети, иждивенцы и служащие — 125 граммов. Хлеб был с большой долей примесей.'}],
tikhvin:[
{h:'Родина композитора',t:'В Тихвине родился композитор Н.А. Римский-Корсаков. Город известен и Тихвинским Богородичным монастырём.'},
{h:'Железнодорожный узел',t:'Тихвин — важная железнодорожная станция: через неё шли грузы к Ладоге для снабжения блокадного Ленинграда. Поэтому за него так отчаянно бились.'},
{h:'Месяц под немцами',t:'Тихвин находился в руках немцев менее месяца: с 8 ноября по 9 декабря 1941 года. Этого хватило, чтобы перерезать снабжение Ладоги.'},
{h:'Первый успех зимы',t:'Освобождение Тихвина стало одним из первых успехов зимнего контрнаступления Красной Армии 1941 года и вернуло железнодорожную связь к Ладоге.'},
{h:'Армия Мерецкова',t:'Тихвин освобождали войска 4-й армии под командованием К.А. Мерецкова.'}],
sevastopol:[
{h:'Вторая оборона города',t:'Первая оборона Севастополя в Крымскую войну (1854–1855) длилась 349 дней. Поэтому оборону 1941–1942 годов называют второй героической обороной.'},
{h:'Лучший снайпер',t:'Под Одессой и Севастополем воевала снайпер Людмила Павличенко. На её счету 309 подтверждённых уничтоженных солдат и офицеров противника.'},
{h:'«Чёрная смерть»',t:'Немцы называли черноморских морских пехотинцев «чёрной смертью». Они бросались в рукопашную даже против превосходящих сил.'},
{h:'Сверхтяжёлая «Дора»',t:'Под Севастополем использовали 800-миллиметровое орудие «Дора». Его доставили по железной дороге в разобранном виде.'},
{h:'35-я береговая батарея',t:'Береговая батарея вела огонь до последних дней обороны. Её позиции стали символом стойкости защитников.'}],
kharkov:[
{h:'Бывшая столица',t:'До 1934 года Харьков был столицей Советской Украины, поэтому его судьба имела не только военное, но и символическое значение.'},
{h:'Погибшие генералы',t:'В боях под Барвенковом погибли генералы К.П. Подлас, А.М. Городнянский и Ф.Я. Костенко.'},
{h:'Четыре смены хозяев',t:'За время войны Харьков четыре раза переходил из рук в руки. Окончательно его освободили 23 августа 1943 года.'},
{h:'Заводы уехали на восток',t:'Харьковский паровозостроительный завод, где делали танки Т-34, в 1941 году эвакуировали в Нижний Тагил. Там выпуск Т-34 продолжили.'},
{h:'Взят в октябре 1941',t:'Впервые немцы заняли Харьков в октябре 1941 года. Весной 1942 года город пытались вернуть, но операция закончилась тяжёлым поражением.'}],
rzhev:[
{h:'Строка Твардовского',t:'Стихотворение Александра Твардовского «Я убит подо Ржевом» стало одним из символов памяти об этих боях. Оно написано в 1945–1946 годах.'},
{h:'Операция «Марс»',t:'Осенью 1942 года на этом же выступе провели операцию «Марс» под руководством Г.К. Жукова. Она не достигла цели и долго оставалась малоизвестной.'},
{h:'Город воинской славы',t:'Ржев получил почётное звание «Город воинской славы» в 2007 году — как память о многомесячных боях за город.'},
{h:'Мемориал солдату',t:'Ржевский мемориал Советскому солдату открыт в 2020 году. Его высота около 25 метров: бронзовый солдат на фоне журавлей.'},
{h:'«Сашка» Кондратьева',t:'В повести Вячеслава Кондратьева «Сашка» показаны бои под Ржевом глазами рядового солдата. Автор сам воевал на этом участке.'}],
stalingrad:[
{h:'Фельдмаршал, который сдался',t:'Гитлер присвоил Паулюсу звание фельдмаршала 30 января 1943 года. Расчёт был на то, что ни один немецкий фельдмаршал в плен не сдавался.'},
{h:'Тракторный завод',t:'Сталинградский тракторный завод до последней возможности выпускал танки Т-34, а рабочие нередко вставали у орудий прямо в цехах.'},
{h:'«Детский хоровод»',t:'Фотограф Эммануил Евзерихин снял знаменитый «Детский хоровод» у фонтана 23 августа 1942 года, в день первых массированных бомбардировок города.'},
{h:'«Родина-мать зовёт!»',t:'Скульптура на Мамаевом кургане, открытая в 1967 году, имеет высоту 85 метров. Это место — главный мемориал битвы.'},
{h:'Снайпер Зайцев',t:'Василий Зайцев уничтожил более 200 солдат и офицеров противника. Его история легла в основу фильма «Враг у ворот».'}],
kavkaz:[
{h:'Горные стрелки «Эдельвейс»',t:'На Кавказ были направлены элитные горные стрелки дивизии «Эдельвейс». Они водрузили немецкий флаг на Эльбрусе — высочайшей вершине Кавказа.'},
{h:'Малая земля',t:'Плацдарм Малая земля под Новороссийском удерживали 225 дней: с февраля по сентябрь 1943 года.'},
{h:'Нефть Майкопа и Грозного',t:'Одной из главных целей вермахта была кавказская нефть. Без неё немецкой армии грозил топливный голод.'},
{h:'Десант Куникова',t:'В феврале 1943 года десант майора Цезаря Куникова захватил плацдарм под Новороссийском. Так появилась Малая земля.'},
{h:'Освобождение Новороссийска',t:'Новороссийск освободили 16 сентября 1943 года. Позже город получил звание «Город-герой».'}],
iskra:[
{h:'Маршальское звание в день прорыва',t:'18 января 1943 года, в день прорыва блокады, Г.К. Жуков получил звание Маршала Советского Союза.'},
{h:'Первый поезд',t:'Первый поезд по новой «Дороге Победы» прибыл в Ленинград 7 февраля 1943 года. Дорога проходила в зоне досягаемости немецкой артиллерии.'},
{h:'Встреча в Рабочем посёлке №1',t:'18 января 1943 года войска Ленинградского и Волховского фронтов встретились в Рабочем посёлке №1 — так была прорвана блокада.'},
{h:'Крепость Орешек',t:'Крепость Орешек в Шлиссельбурге оставалась в руках защитников на протяжении всей блокады.'},
{h:'Узкий коридор',t:'Прорыв образовал коридор шириной всего 8–11 километров вдоль берега Ладоги. Он простреливался, но позволил проложить дорогу.'}],
kursk:[
{h:'Дебют новых танков',t:'Курская битва стала боевым дебютом тяжёлых немецких «Пантер» и самоходок «Фердинанд».'},
{h:'Упреждающая артподготовка',t:'Зная время немецкого удара, Рокоссовский решился на артиллерийскую контрподготовку: огонь открыли за считанные минуты до начала вражеского наступления.'},
{h:'Первая победа Кожедуба',t:'Лётчик Иван Кожедуб одержал свою первую воздушную победу именно в Курской битве, 6 июля 1943 года.'},
{h:'Оборона в глубину',t:'Советская оборона была эшелонирована на глубину до 300 километров. Плотность минирования достигала 1500 противотанковых мин на километр фронта.'},
{h:'Спор о Прохоровке',t:'Историки до сих пор спорят о точном числе танков, участвовавших во встречном сражении под Прохоровкой, и о потерях сторон.'}],
dnepr:[
{h:'Ставка торопила',t:'Освободить Киев хотели к годовщине Октября, 7 ноября. Город освободили 6 ноября 1943 года.'},
{h:'Неудачный десант',t:'В ночь на 24 сентября 1943 года высадили Днепровский воздушный десант. Из-за ошибок и сильного огня он понёс тяжёлые потери и не выполнил задачу.'},
{h:'Форсирование на подручных средствах',t:'Многие бойцы форсировали Днепр на брёвнах, бочках, плащ-палатках, не дожидаясь понтонов.'},
{h:'Лютежский плацдарм',t:'Решающий удар нанесли с Лютежского плацдарма севернее Киева. Он позволил обойти город и освободить его 6 ноября.'},
{h:'2438 Героев',t:'За форсирование Днепра звание Героя Советского Союза получили 2438 человек — больше, чем в любой другой операции войны.'}],
'leningrad-novgorod':[
{h:'Салют в честь снятия блокады',t:'27 января 1944 года в Ленинграде дали салют: 24 залпа из 324 орудий.'},
{h:'Новгородский памятник',t:'Немцы разобрали памятник «Тысячелетие России» в Новгороде, готовя вывоз. После освобождения города его нашли и вернули на место.'},
{h:'Освобождение Новгорода',t:'Новгород освободили 20 января 1944 года. Город был почти полностью разрушен.'},
{h:'Янтарная комната',t:'С 1941 года Янтарная комната находилась в Кёнигсберге. После 1945 года её следы теряются, судьба остаётся загадкой.'},
{h:'Фронт отодвинули',t:'К 1 марта 1944 года немцев отбросили от Ленинграда на 220–280 километров.'}],
'dnepr-karpaty':[
{h:'Валлонцы в «котле»',t:'В Корсунь-Шевченковском «котле» оказалась и бригада СС «Валлония», набранная из бельгийских добровольцев.'},
{h:'Маршальские погоны',t:'За Корсунь-Шевченковскую операцию И.С. Конев получил звание Маршала Советского Союза (20 февраля 1944).'},
{h:'«Сталинград на Днепре»',t:'Корсунь-Шевченковский «котёл» иногда называют «Сталинградом на Днепре»: в окружении оказались около 70 тысяч немцев.'},
{h:'Смерть генерала Ватутина',t:'Командующий 1-м Украинским фронтом Николай Ватутин был ранен бандеровцами 29 февраля 1944 года и умер 15 апреля.'},
{h:'Весенняя распутица',t:'Весенняя распутица 1944 года сильно осложняла наступление: техника вязла в грязи, снабжение отставало.'}],
'odessa-krym':[
{h:'Одесские катакомбы',t:'В 1941–1944 годах в катакомбах под Одессой действовал партизанский отряд В.А. Молодцова-Бадаева.'},
{h:'Ялта — через девять месяцев',t:'Спустя девять месяцев после освобождения Крыма в Ливадийском дворце, близ Ялты, прошла конференция лидеров СССР, США и Великобритании (февраль 1945).'},
{h:'73 дня обороны',t:'Первая оборона Одессы в 1941 году длилась 73 дня. Затем гарнизон эвакуировали в Крым.'},
{h:'Штурм Сапун-горы',t:'7 мая 1944 года штурм Сапун-горы стал ключом к освобождению Севастополя. Город освободили 9 мая.'},
{h:'Мыс Херсонес',t:'Остатки немцев прижали к мысу Херсонес, откуда они пытались эвакуироваться морем. Многие были уничтожены или взяты в плен.'}],
vyborg:[
{h:'Финский Выборг',t:'До 1944 года Выборг (по-фински Виипури) был одним из крупнейших городов Финляндии.'},
{h:'Крупнейшая битва Севера',t:'Сражение у Тали-Ихантала летом 1944 года считается самым масштабным в истории Северной Европы.'},
{h:'Маннергейм — президент',t:'4 августа 1944 года маршал Маннергейм стал президентом Финляндии и начал готовить выход из войны.'},
{h:'Лапландская война',t:'После выхода из войны Финляндия воевала против немцев в Лапландской войне (1944–1945).'},
{h:'Взятие Выборга',t:'Выборг был взят 20 июня 1944 года, на десятый день наступления.'}],
bagration:[
{h:'Парад пленных',t:'17 июля 1944 года по улицам Москвы провели колонну немецких пленных. После неё улицы демонстративно вымыли поливальными машинами.'},
{h:'Рельсовая война',t:'В ночь на 20 июня 1944 года, накануне наступления, белорусские партизаны подорвали более 10 тысяч рельсов. Это парализовало немецкие перевозки.'},
{h:'Имя героя 1812 года',t:'Операция названа в честь полководца Отечественной войны 1812 года Петра Багратиона.'},
{h:'Через три года',t:'Операцию начали 23 июня 1944 года — почти день в день через три года после начала войны.'},
{h:'68 дней наступления',t:'Наступление продолжалось 68 дней, с 23 июня по 29 августа. Войска прошли с боями до 550–600 километров.'}],
lviv:[
{h:'Операция «Буря»',t:'Одновременно с Красной Армией во Львове действовали отряды польской Армии Крайовой (операция «Буря»).'},
{h:'Три названия города',t:'Лемберг, Львув, Львов: город сменил несколько названий и государств за последние 150 лет.'},
{h:'Сандомирский плацдарм',t:'Захваченный на Висле Сандомирский плацдарм позже стал исходным рубежом для Висло-Одерской операции.'},
{h:'Освобождение Львова',t:'Львов освободили 27 июля 1944 года. Операция началась 13 июля.'},
{h:'Бродский «котёл»',t:'Под Бродами была окружена немецкая группировка. Это открыло путь к Львову.'}],
iassy:[
{h:'Переворот короля Михая',t:'23 августа 1944 года молодой король Румынии Михай арестовал диктатора Иона Антонеску. До 1989 года эта дата была главным государственным праздником Румынии.'},
{h:'Нефть Плоешти',t:'Нефтяные промыслы Плоешти, главный источник топлива для вермахта, перешли под контроль советских войск в конце августа 1944 года.'},
{h:'Замыкание кольца у Хуши',t:'Кольцо окружения замкнулось у города Хуши 24–25 августа 1944 года.'},
{h:'Кишинёв освобождён',t:'Кишинёв освободили 24 августа 1944 года, на пятый день операции.'},
{h:'Вторая гибель 6-й армии',t:'В Ясско-Кишинёвской операции была разгромлена 6-я немецкая армия. Её уже воссоздавали после Сталинграда.'}],
pribaltika:[
{h:'Таллинская операция',t:'Таллин освободили 22 сентября 1944 года в ходе Таллинской операции Ленинградского фронта.'},
{h:'Последний очаг на Сааремаа',t:'Последний очаг сопротивления на эстонской земле, полуостров Сырве на острове Сааремаа, подавили 24 ноября 1944 года.'},
{h:'Освобождение Риги',t:'Рига была освобождена 13 октября 1944 года.'},
{h:'Курляндский «котёл»',t:'Остатки группы армий «Север» продержались в Курляндии до мая 1945 года.'},
{h:'Четыре фронта',t:'В Прибалтийской операции действовали три Прибалтийских и Ленинградский фронты. Она шла с 14 сентября по 24 ноября.'}],
belgrade:[
{h:'Корпус Людвика Свободы',t:'В Восточно-Карпатской операции сражался чехословацкий корпус Л. Свободы. Позже он стал президентом Чехословакии.'},
{h:'Похищение сына Хорти',t:'15 октября 1944 года Отто Скорцени похитил сына венгерского регента Хорти и сорвал его попытку выйти из войны.'},
{h:'Освобождение Белграда',t:'Белград освободили 20 октября 1944 года вместе с югославскими партизанами Тито.'},
{h:'Ужгород',t:'Ужгород освободили 27 октября 1944 года, когда советские войска вышли к границам Венгрии и Чехословакии.'},
{h:'Дуклинский перевал',t:'В Восточно-Карпатской операции шли тяжёлые бои за Дуклинский перевал, где сражался и корпус Людвика Свободы.'}],
petsamo:[
{h:'Никель Петсамо',t:'В районе Петсамо добывали никель, жизненно важный для немецкой военной промышленности.'},
{h:'Дом для Печенги',t:'До 1920 года Печенга принадлежала России, затем Финляндии (Петсамо). В 1944 году её вернули СССР.'},
{h:'Освобождение Киркенеса',t:'Киркенес освободили 25 октября 1944 года. Он стал первым норвежским городом, освобождённым Красной Армией.'},
{h:'Уход из Норвегии',t:'Советские войска покинули северную Норвегию в сентябре 1945 года.'},
{h:'Десант в Лиинахамари',t:'13 октября 1944 года морской десант захватил порт Лиинахамари — главный порт вывоза никеля.'}],

const FACTS = {};

const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);
const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; return e; };
const escapeHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escapeRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const yearLabels = {1941:'Начало войны',1942:'Перелом на юге',1943:'Коренной перелом',1944:'Изгнание врага',1945:'Победа'};
const findBattle = id => BATTLES.find(b => b.id === id);
const SEARCH_ICON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.5" y2="16.5"></line></svg>';

function renderIndex(){
const root = $('#app'); root.innerHTML = '';
const wrap = el('div', 'view');
const header = el('header', 'page-header');
header.innerHTML = '<h1>1941 — 1945</h1><p class="subtitle">Великая Отечественная война</p><p class="hero-quote">Те, кто не знает истории, обречены повторять её.<small>Джордж Сантаяна</small></p>';
wrap.appendChild(header);
const searchBox = el('div', 'search-box');
searchBox.innerHTML = '<input type="text" class="search-input" id="searchInput" placeholder="Поиск: битва, командующий, §33, страница 374..." autocomplete="off"><span class="search-icon">' + SEARCH_ICON_SVG + '</span><div class="search-hint"><span class="hint-item" data-q="Сталинград">Сталинград</span><span class="hint-item" data-q="Жуков">Жуков</span><span class="hint-item" data-q="§33">§33</span><span class="hint-item" data-q="374">374</span><span class="hint-item" data-q="1944">1944</span></div>';
wrap.appendChild(searchBox);
const byYear = {}; BATTLES.forEach(b => { if(!byYear[b.year]) byYear[b.year] = []; byYear[b.year].push(b); });
const listRoot = el('div', 'battles-list');
Object.keys(byYear).sort().forEach(year => {
const section = el('section', 'year-section'); section.dataset.year = year;
const h2 = el('h2', 'year-title');
h2.innerHTML = '<span class="year-num">' + year + '</span><span class="year-label">' + yearLabels[year] + '</span><span class="year-meta">' + byYear[year].length + ' сражений</span>';
section.appendChild(h2);
byYear[year].forEach(b => {
const searchText = (b.title + ' ' + b.date + ' ' + b.commanders + ' ' + b.outcome + ' ' + b.course.join(' ') + ' ' + b.para).toLowerCase();
const card = el('a', 'battle-item'); card.href = '#/battle/' + b.id; card.dataset.search = searchText;
card.innerHTML = '<span class="num">№ ' + b.index + '</span><div class="body"><h3 class="card-title">' + escapeHtml(b.title) + '</h3><span class="date card-date">' + escapeHtml(b.date) + '</span><span class="medinsky-line card-para">' + escapeHtml(b.para) + '</span></div><span class="go">→</span>';
section.appendChild(card);
});
listRoot.appendChild(section);
});
wrap.appendChild(listRoot);
const noResults = el('div', 'no-results'); noResults.id = 'noResults';
noResults.innerHTML = '<span class="big">Ничего не найдено</span>Попробуйте изменить запрос.';
wrap.appendChild(noResults);
const footer = el('footer'); footer.textContent = '1941 — 1945';
wrap.appendChild(footer);
root.appendChild(wrap);
initSearch();
}

function initSearch(){
const input = $('#searchInput'); if(!input) return;
const cards = $$('.battle-item'); const sections = $$('.year-section'); const noResults = $('#noResults'); const hints = $$('.hint-item');
cards.forEach(card => {
const titleEl = card.querySelector('.card-title'); const dateEl = card.querySelector('.card-date'); const paraEl = card.querySelector('.card-para');
titleEl.dataset.orig = titleEl.textContent; dateEl.dataset.orig = dateEl.textContent; paraEl.dataset.orig = paraEl.textContent;
});
function highlight(text, query){ if(!query) return escapeHtml(text); const safeText = escapeHtml(text); const re = new RegExp('(' + escapeRegex(escapeHtml(query)) + ')', 'gi'); return safeText.replace(re, '<mark class="hl">$1</mark>'); }
function findMatch(origText, query){ const test = origText.toLowerCase().replace(/ё/g,'е'); const q = query.toLowerCase().replace(/ё/g,'е'); const idx = test.indexOf(q); if(idx < 0) return null; return { start: idx, end: idx + q.length }; }
function makeSnippet(origText, query){ const m = findMatch(origText, query); if(!m) return escapeHtml(origText); const before = origText.slice(0, m.start); const found = origText.slice(m.start, m.end); const after = origText.slice(m.end); const beforeShort = before.length > 14 ? '…' + before.slice(-14) : before; const afterShort = after.length > 14 ? after.slice(0, 14) + '…' : after; return escapeHtml(beforeShort) + '<mark class="hl">' + escapeHtml(found) + '</mark>' + escapeHtml(afterShort); }
function applyFilter(){
const raw = input.value.trim(); const q = raw.toLowerCase().replace(/ё/g, 'е'); let visibleCount = 0;
cards.forEach(card => {
const text = (card.dataset.search || '').replace(/ё/g, 'е'); const titleEl = card.querySelector('.card-title'); const dateEl = card.querySelector('.card-date'); const paraEl = card.querySelector('.card-para');
const match = !q || text.includes(q);
if(match){
card.classList.remove('hidden'); visibleCount++;
if(q){
const titleOrig = titleEl.dataset.orig; const titleMatch = findMatch(titleOrig, raw);
if(titleMatch && titleOrig.length > 40){ titleEl.innerHTML = makeSnippet(titleOrig, raw); } else { titleEl.innerHTML = titleMatch ? highlight(titleOrig, raw) : escapeHtml(titleOrig); }
const dateOrig = dateEl.dataset.orig; dateEl.innerHTML = findMatch(dateOrig, raw) ? highlight(dateOrig, raw) : escapeHtml(dateOrig);
const paraOrig = paraEl.dataset.orig; paraEl.innerHTML = findMatch(paraOrig, raw) ? highlight(paraOrig, raw) : escapeHtml(paraOrig);
} else { titleEl.textContent = titleEl.dataset.orig; dateEl.textContent = dateEl.dataset.orig; paraEl.textContent = paraEl.dataset.orig; }
} else { card.classList.add('hidden'); }
});
sections.forEach(sec => { const visible = sec.querySelectorAll('.battle-item:not(.hidden)').length; sec.style.display = visible === 0 ? 'none' : ''; });
noResults.classList.toggle('show', visibleCount === 0);
}
input.addEventListener('input', applyFilter);
hints.forEach(h => { h.addEventListener('click', () => { input.value = h.dataset.q; input.focus(); applyFilter(); }); });
}

function renderBattle(id){
const b = findBattle(id); if(!b){ location.hash = ''; return; }
const root = $('#app'); root.innerHTML = '';
const wrap = el('div', 'view battle-page');
const back = el('a', 'back'); back.href = '#/'; back.innerHTML = '← Назад к хронике'; wrap.appendChild(back);
const titleBox = el('div', 'page-title');
titleBox.innerHTML = '<span class="medal"><span>' + b.index + '</span></span><span class="num">№ ' + b.index + ' · ' + b.year + '</span><h1>' + escapeHtml(b.title) + '</h1><div class="date">' + escapeHtml(b.date) + '</div><span class="medinsky-line">' + escapeHtml(b.para) + '</span>';
titleBox.insertAdjacentHTML('beforeend', '<div class="scrap" aria-hidden="true"><div class="scrap-in">…пишу тебе наскоро, дорогая мама. Я жив и здоров, ты не тревожься. Как станет полегче, напишу подробнее. Береги себя и сестрёнку…</div></div>'); wrap.appendChild(titleBox);
const cmd = el('div', 'section commanders');
cmd.innerHTML = '<div class="section-label">' + escapeHtml(b.commandersLabel) + '</div><p class="section-text names">' + escapeHtml(b.commanders) + '</p>';
wrap.appendChild(cmd);
const course = el('div', 'section course');
let courseHTML = '<div class="section-label">Ход битвы</div>';
b.course.forEach(p => { courseHTML += '<p class="section-text">' + escapeHtml(p) + '</p>'; });
course.innerHTML = courseHTML; wrap.appendChild(course);
{ const items = DEEP[b.id] || []; const facts = FACTS[b.id] || []; const d = el('div', 'section deep');
let dh = '<i class="sp s1"></i><i class="sp s2"></i><i class="sp s3"></i><i class="sp s4"></i><i class="sp s5"></i><i class="cn c1"></i><i class="cn c2"></i><i class="cn c3"></i><i class="cn c4"></i><div class="deep-head"><div class="section-label">Углублённое изучение</div><div class="orn-line">⚜</div><p class="deep-hint">Нажмите на пункт, чтобы раскрыть подробности.</p></div>';
items.forEach(x => { const ph = x.img ? '<div class="fact-photo"><div class="fact-frame"><img src="' + x.img + '" alt="' + escapeHtml(x.cap || x.h) + '" loading="lazy"></div>' + (x.cap ? '<div class="fact-cap">' + escapeHtml(x.cap) + '</div>' : '') + '</div>' : ''; dh += '<div class="deep-item"><button class="deep-q" aria-expanded="false"><span class="plus"></span>' + escapeHtml(x.h) + '</button><div class="deep-a"><div><p>' + escapeHtml(x.t) + '</p>' + ph + '</div></div></div>'; });
if(facts.length){ facts.forEach(f => { const o = (typeof f === 'string') ? {t:f} : f; if(o.img){ dh += '<div class="deep-item fact-item"><button class="deep-q" aria-expanded="false"><span class="plus"></span>' + escapeHtml(o.t) + '</button><div class="deep-a"><div><div class="fact-photo"><div class="fact-frame"><img src="' + o.img + '" alt="' + escapeHtml(o.cap || o.t) + '" loading="lazy"></div>' + (o.cap ? '<div class="fact-cap">' + escapeHtml(o.cap) + '</div>' : '') + '</div></div></div></div>'; } else { dh += '<div class="deep-item fact-item"><div class="deep-q deep-static"><span class="plus"></span>' + escapeHtml(o.t) + '</div></div>'; } }); }
d.innerHTML = dh; wrap.appendChild(d);
d.querySelectorAll('button.deep-q').forEach(btn => btn.addEventListener('click', () => { const open = btn.getAttribute('aria-expanded') === 'true'; btn.setAttribute('aria-expanded', String(!open)); btn.nextElementSibling.classList.toggle('open', !open); }));
}
const map = el('div', 'section map-section');
map.innerHTML = '<div class="section-label">Карта-схема</div><div class="map-frame"><img src="' + b.img + '" alt="' + escapeHtml(b.title) + '" loading="lazy"></div><p class="map-caption">' + escapeHtml(b.imgCaption) + '</p>';
wrap.appendChild(map);
const outcome = el('div', 'section outcome');
outcome.innerHTML = '<div class="section-label">Итог</div><p class="section-text">' + escapeHtml(b.outcome) + '</p>';
wrap.appendChild(outcome);
const tasks = el('div', 'section tasks');
let tasksHTML = '<div class="section-label">Задания в формате ФИПИ</div>';
b.tasks.forEach((t, i) => {
tasksHTML += '<div class="task" data-answer="' + escapeHtml(t.answer) + '"><p class="task-q"><span class="task-num">' + String(i+1).padStart(2,'0') + '</span>' + escapeHtml(t.q) + '</p><div class="answer-row"><input type="text" class="answer-input" placeholder="Введите ответ..."><button class="check-btn">Проверить</button></div><div class="result"></div></div>';
});
tasks.innerHTML = tasksHTML; wrap.appendChild(tasks);
const footer = el('footer'); footer.textContent = '1941 — 1945 · ' + b.index;
wrap.appendChild(footer);
root.appendChild(wrap); window.scrollTo({top:0, behavior:'instant'});
initTaskChecks();
}

function normalize(s){
return s.toLowerCase().replace(/ё/g, 'е').replace(/[«»"']/g, '').replace(/\s+/g, ' ').replace(/[.,;:!?]/g, '').trim();
}

function initTaskChecks(){
$$('.task').forEach(task => {
const input = task.querySelector('.answer-input'); const btn = task.querySelector('.check-btn'); const result = task.querySelector('.result'); const correct = task.getAttribute('data-answer').split('|');
function check(){
const user = normalize(input.value);
if(!user){ result.className = 'result show fail'; result.innerHTML = '<span class="tag">ВНИМАНИЕ</span> Введите ответ.'; return; }
const ok = correct.some(a => normalize(a) === user);
input.classList.remove('correct','wrong');
if(ok){ input.classList.add('correct'); result.className = 'result show ok'; result.innerHTML = '<span class="tag">ВЕРНО</span>'; }
else { input.classList.add('wrong'); result.className = 'result show fail'; result.innerHTML = '<span class="tag">НЕВЕРНО</span> Правильный ответ: <strong>' + escapeHtml(correct[0]) + '</strong>'; }
}
btn.addEventListener('click', check);
input.addEventListener('keypress', e => { if(e.key === 'Enter') check(); });
input.addEventListener('input', () => { input.classList.remove('correct','wrong'); result.className = 'result'; result.innerHTML = ''; });
});
}

function route(){
const hash = location.hash || '#/';
const m = hash.match(/^#\/battle\/(.+)$/);
if(m){ renderBattle(m[1]); } else { renderIndex(); }
}
window.addEventListener('hashchange', route);
route();

const themeToggle = $('#themeToggle'); const themeIcon = $('#themeIcon'); const htmlEl = document.documentElement;
function applyTheme(theme){ htmlEl.setAttribute('data-theme', theme); themeIcon.textContent = (theme === 'dark') ? '☀' : '☾'; try { localStorage.setItem('theme', theme); } catch(e){} }
let saved = 'dark'; try { saved = localStorage.getItem('theme') || 'dark'; } catch(e){}
applyTheme(saved);
themeToggle.addEventListener('click', () => { applyTheme(htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); });
})();
</script>
