{id:'brest',year:1941,index:'01',title:'Оборона Бреста',date:'22 июня — июль 1941',para:'§29 · С. 308–321',img:'images/A.png',imgCaption:'Схема обороны Брестской крепости, 1941 г.',commandersLabel:'Участники',commanders:'П.М. Гаврилов, И.Н. Зубачев, Е.М. Фомин, А.М. Кижеватов',course:['Брестская крепость первой приняла удар немецких войск 22 июня 1941 года. Гарнизон, насчитывавший около 3,5 тысяч человек, оказался в полном окружении уже в первые часы войны.','Однако бойцы под командованием майора П.М. Гаврилова, капитана И.Н. Зубачева, полкового комиссара Е.М. Фомина и лейтенанта А.М. Кижеватова организовали упорную оборону. Штурмовые группы вермахта несли большие потери.','Отдельные группы защитников сражались в подвалах и казематах более месяца — до конца июля. На стенах крепости остались надписи: «Умираем, но не сдаёмся!», «Прощай, Родина!».','Оборона Брестской крепости стала символом стойкости и массового героизма советских солдат в первые, самые тяжёлые дни войны.'],outcome:'Сдача крепости. В 1965 году Брестской крепости присвоено звание «Крепость-герой».',tasks:[
